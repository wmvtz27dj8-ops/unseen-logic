<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unseen Logic — 3D Formula Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    canvas { display: block; }
    .hud {
      position: absolute;
      top: 40px;
      left: 40px;
      pointer-events: none;
    }
    h1 { font-size: 2.2rem; font-weight: 600; letter-spacing: -0.03em; }
    p { color: #86868b; margin-top: 8px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="hud">
    <h1>Unseen Logic</h1>
    <p>Live 3D Spatial Formula Engine — Deployed via GitHub Pages</p>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.170.0/build/three.module.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.TorusKnotGeometry(1, 0.32, 180, 32);
    const material = new THREE.MeshStandardMaterial({
      color: 0x4f9cf9,
      roughness: 0.2,
      metalness: 0.85,
      wireframe: true
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const light = new THREE.PointLight(0xffffff, 40);
    light.position.set(3, 3, 4);
    scene.add(light);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      mesh.rotation.x += 0.005;
      mesh.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
